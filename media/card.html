<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:TS;font-weight:500;src:url("{{FONTS}}/thmanyahsans-Medium.woff2")}
@font-face{font-family:TS;font-weight:700;src:url("{{FONTS}}/thmanyahsans-Bold.woff2")}
@font-face{font-family:TS;font-weight:900;src:url("{{FONTS}}/thmanyahsans-Black.woff2")}
*{box-sizing:border-box;margin:0}
html,body{width:720px;height:720px;overflow:hidden;font-family:TS,sans-serif;color:#eaf4fb}
body.m-title{background:radial-gradient(circle at 50% 38%,rgba(34,211,238,.28),rgba(34,211,238,0) 52%),#03070F}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.logo{width:250px;height:250px;filter:drop-shadow(0 18px 40px rgba(34,211,238,.35));margin-top:-30px}
h1{font-weight:900;font-size:112px;letter-spacing:-2px;line-height:1}
h1 b{color:#22D3EE;font-weight:900}
p{font-weight:500;font-size:36px;color:#a9bdd0}
.chip{margin-top:18px;font-weight:700;font-size:22px;letter-spacing:.5px;color:#22D3EE;border:1.5px solid rgba(34,211,238,.55);border-radius:999px;padding:7px 20px;background:rgba(34,211,238,.08)}
.pill{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);white-space:nowrap;display:flex;align-items:center;gap:14px;
 font-weight:700;font-size:30px;padding:10px 28px 12px 22px;border-radius:999px;background:rgba(7,13,22,.88);border:1.5px solid rgba(34,211,238,.6);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.pill i{width:14px;height:14px;border-radius:50%;background:#22D3EE;box-shadow:0 0 14px #22D3EE}
.pill span{color:#8fa6bb;font-weight:500}
</style></head><body class="m-{{MODE}}">
{{BODY}}
</body></html>
