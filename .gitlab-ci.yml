# GitLab CI for the company mirror. The instance runners take only tagged jobs (k8s-build), so every job carries that tag.
# NJ-Flush is a Windows WinForms/WPF app built with the .NET Framework csc (build.cmd); the Linux runner cannot build it,
# so this pipeline runs the part that works here: the full-history secret scan.
default:
  tags: [k8s-build]
  interruptible: true
variables:
  GIT_DEPTH: "0" # the secret scan reads the whole history

secrets:
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks git . --redact --verbose
