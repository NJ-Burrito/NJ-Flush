<?xml version="1.0" encoding="UTF-8"?>
<!-- NJ-Flush logo master, 1024 x 1024. Own vector art, no third-party parts, no text.
     Light from the top-left. Dark tile + cyan #22D3EE accent. Used for 40 px and larger. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21415C"/><stop offset="0.5" stop-color="#12243A"/><stop offset="1" stop-color="#08111D"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="660" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.42"/><stop offset="0.6" stop-color="#22D3EE" stop-opacity="0.10"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimline" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.04"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="gloss" cx="250" cy="120" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="porc" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#E6EEF4"/><stop offset="1" stop-color="#9DB0C0"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#DCE7EF"/><stop offset="1" stop-color="#93A8BA"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6F8799"/><stop offset="0.35" stop-color="#B9C8D4"/><stop offset="1" stop-color="#F1F6F9"/>
    </linearGradient>
    <radialGradient id="water" cx="490" cy="690" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8FDFF"/><stop offset="0.42" stop-color="#22D3EE"/><stop offset="1" stop-color="#0E8AA8"/>
    </radialGradient>
    <linearGradient id="arm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#E0FBFF" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="drain" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#020A14"/><stop offset="0.65" stop-color="#08273A"/><stop offset="1" stop-color="#08273A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="btn" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#D5FAFF"/><stop offset="1" stop-color="#0891B2"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="tileclip"><rect x="40" y="40" width="944" height="944" rx="214"/></clipPath>
    <clipPath id="waterclip"><path transform="translate(512 676) scale(0.64) translate(-512 -650)" d="M512 288C592 288 642 330 692 410C762 520 800 560 800 660C800 815 680 905 512 905C344 905 224 815 224 660C224 560 262 520 332 410C382 330 432 288 512 288Z"/></clipPath>
    <path id="bowl" d="M512 288C592 288 642 330 692 410C762 520 800 560 800 660C800 815 680 905 512 905C344 905 224 815 224 660C224 560 262 520 332 410C382 330 432 288 512 288Z"/>
  </defs>

  <!-- tile -->
  <rect x="40" y="40" width="944" height="944" rx="214" fill="url(#tile)"/>
  <g clip-path="url(#tileclip)">
    <rect x="40" y="40" width="944" height="944" fill="url(#glow)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#gloss)"/>
  </g>
  <rect x="43" y="43" width="938" height="938" rx="211" fill="none" stroke="url(#rimline)" stroke-width="6"/>

  <!-- tank (back) -->
  <rect x="318" y="156" width="388" height="170" rx="62" fill="#000" opacity="0.4" filter="url(#soft2)" transform="translate(0 16)"/>
  <rect x="318" y="150" width="388" height="170" rx="62" fill="url(#tank)"/>
  <path d="M352 196C372 168 420 160 470 160" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity="0.9" filter="url(#soft3)"/>
  <circle cx="512" cy="232" r="34" fill="url(#btn)"/>
  <ellipse cx="502" cy="220" rx="13" ry="8" fill="#fff" opacity="0.8" transform="rotate(-30 502 220)"/>

  <!-- bowl contact shadow + body -->
  <use href="#bowl" fill="#000" opacity="0.55" filter="url(#soft)" transform="translate(0 30)"/>
  <use href="#bowl" fill="url(#porc)"/>
  <!-- rim bevel: darker band toward the bottom-right, light top-left -->
  <use href="#bowl" fill="none" stroke="#fff" stroke-opacity="0.0" stroke-width="2"/>
  <path d="M258 600C272 520 300 470 352 408" fill="none" stroke="url(#spec)" stroke-width="16" stroke-linecap="round" opacity="0.95" filter="url(#soft3)"/>

  <!-- inner basin -->
  <path transform="translate(512 668) scale(0.78) translate(-512 -650)" d="M512 288C592 288 642 330 692 410C762 520 800 560 800 660C800 815 680 905 512 905C344 905 224 815 224 660C224 560 262 520 332 410C382 330 432 288 512 288Z" fill="url(#inner)"/>

  <!-- water -->
  <g clip-path="url(#waterclip)">
    <path transform="translate(512 676) scale(0.64) translate(-512 -650)" d="M512 288C592 288 642 330 692 410C762 520 800 560 800 660C800 815 680 905 512 905C344 905 224 815 224 660C224 560 262 520 332 410C382 330 432 288 512 288Z" fill="url(#water)"/>
    <g transform="translate(512 696) scale(1.12)">
      <g id="arms">
        <path d="M0 0C-6-70 44-138 140-134C76-112 30-64 0 0Z" fill="url(#arm)"/>
        <path d="M0 0C-6-70 44-138 140-134C76-112 30-64 0 0Z" fill="url(#arm)" transform="rotate(90)"/>
        <path d="M0 0C-6-70 44-138 140-134C76-112 30-64 0 0Z" fill="url(#arm)" transform="rotate(180)"/>
        <path d="M0 0C-6-70 44-138 140-134C76-112 30-64 0 0Z" fill="url(#arm)" transform="rotate(270)"/>
      </g>
      <circle r="58" fill="url(#drain)"/>
    </g>
    <!-- water specular, top-left -->
    <ellipse cx="420" cy="540" rx="70" ry="20" fill="#fff" opacity="0.55" transform="rotate(-34 420 540)" filter="url(#soft3)"/>
  </g>
  <!-- inner-rim shadow top-left of the basin (depth) -->
  <path transform="translate(512 676) scale(0.64) translate(-512 -650)" d="M512 288C592 288 642 330 692 410C762 520 800 560 800 660C800 815 680 905 512 905C344 905 224 815 224 660C224 560 262 520 332 410C382 330 432 288 512 288Z" fill="none" stroke="#06202F" stroke-opacity="0.45" stroke-width="10"/>
</svg>
